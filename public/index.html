<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMatch Career</title>
    <style>
        /* ============================================ */
        /* RESET E BASE - PREMIUM */
        /* ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0b0d11;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(139, 92, 246, 0.06) 0%, transparent 60%);
            overflow-x: hidden;
        }

        .container {
            max-width: 680px;
            width: 100%;
            background: rgba(20, 23, 31, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
                border-radius: 24px;
            }
        }

        /* ============================================ */
        /* HEADER */
        /* ============================================ */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 6px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e8edf5 0%, #a5b4d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #8892a8;
            font-size: 0.95rem;
            margin-top: 2px;
            margin-bottom: 32px;
            padding-left: 4px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .subtitle span {
            color: #818cf8;
            font-weight: 500;
        }

        /* ============================================ */
        /* DROPZONE - CORRIGIDA */
        /* ============================================ */
        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 44px 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: rgba(255, 255, 255, 0.02);
            position: relative;
            overflow: hidden;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Borda externa com glow (efeito extra) */
        .dropzone::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0), rgba(139, 92, 246, 0));
            transition: all 0.4s ease;
            z-index: -1;
        }

        .dropzone:hover::after,
        .dropzone.dragover::after {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
        }

        .dropzone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.03), rgba(139, 92, 246, 0.03));
            opacity: 0;
            transition: opacity 0.4s ease;
            border-radius: 20px;
        }

        .dropzone:hover::before,
        .dropzone.dragover::before {
            opacity: 1;
        }

        .dropzone:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.08);
        }

        .dropzone.dragover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 12px 48px rgba(99, 102, 241, 0.12);
        }

        .dropzone input {
            display: none;
        }

        .dropzone-icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: block;
            opacity: 0.6;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .dropzone:hover .dropzone-icon {
            transform: scale(1.05) rotate(-2deg);
        }

        .dropzone-text {
            color: #b0bcca;
            font-size: 1rem;
            font-weight: 450;
            letter-spacing: 0.2px;
            position: relative;
            z-index: 1;
        }

        .dropzone-text strong {
            color: #818cf8;
            font-weight: 600;
        }

        .dropzone-hint {
            color: #5a657a;
            font-size: 0.8rem;
            margin-top: 8px;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 1;
        }

        #filename {
            margin-top: 14px;
            color: #818cf8;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.08);
            border-radius: 100px;
            display: inline-block;
            border: 1px solid rgba(99, 102, 241, 0.10);
            transition: all 0.3s ease;
            animation: fadeInUp 0.4s ease;
            position: relative;
            z-index: 1;
        }

        #filename:empty {
            display: none;
        }

        /* ============================================ */
        /* ANIMAÇÃO FADE IN */
        /* ============================================ */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================ */
        /* BOTÕES - PREMIUM */
        /* ============================================ */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        @media (max-width: 480px) {
            .btn-group {
                flex-direction: column;
            }
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: rotate(45deg) translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-primary:hover:not(:disabled)::after {
            transform: rotate(45deg) translateX(100%);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0px);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: #b0bcca;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .btn-secondary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ============================================ */
        /* STATUS - COM LOADING WAVES */
        /* ============================================ */
        #status {
            margin-top: 20px;
            color: #8892a8;
            font-size: 0.9rem;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            min-height: 20px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #status:empty {
            display: none;
        }

        .loading-waves {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .loading-waves span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #818cf8;
            animation: wave 1.2s ease-in-out infinite;
        }

        .loading-waves span:nth-child(2) { animation-delay: 0.2s; }
        .loading-waves span:nth-child(3) { animation-delay: 0.4s; }
        .loading-waves span:nth-child(4) { animation-delay: 0.6s; }
        .loading-waves span:nth-child(5) { animation-delay: 0.8s; }

        @keyframes wave {
            0%, 40%, 100% { transform: scale(0.4); opacity: 0.3; }
            20% { transform: scale(1.2); opacity: 1; }
        }

        .status-text {
            flex: 1;
        }

        .status-text .highlight {
            color: #818cf8;
            font-weight: 500;
        }

        /* ============================================ */
        /* SKELETON LOADING */
        /* ============================================ */
        .skeleton-container {
            margin-top: 28px;
        }

        .skeleton-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .skeleton-header .skeleton-title {
            width: 180px;
            height: 20px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .skeleton-header .skeleton-count {
            width: 60px;
            height: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 100px;
            animation: pulse 1.5s ease-in-out infinite 0.3s;
        }

        .skeleton-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 20px 22px;
            margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .skeleton-card .skeleton-line {
            height: 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            margin-bottom: 8px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .skeleton-card .skeleton-line:nth-child(2) {
            width: 60%;
            animation-delay: 0.2s;
        }

        .skeleton-card .skeleton-line:nth-child(3) {
            width: 30%;
            height: 10px;
            margin-bottom: 0;
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* ============================================ */
        /* RESULTADOS */
        /* ============================================ */
        #resultados {
            margin-top: 28px;
        }

        .resultados-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            animation: fadeInUp 0.5s ease;
        }

        .resultados-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #b0bcca;
            letter-spacing: 0.5px;
        }

        .resultados-header .count {
            font-size: 0.8rem;
            color: #5a657a;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px;
            border-radius: 100px;
        }

        .vaga {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 20px 22px;
            margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            animation: vagaEntra 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .vaga:nth-child(2) { animation-delay: 0.1s; }
        .vaga:nth-child(3) { animation-delay: 0.2s; }
        .vaga:nth-child(4) { animation-delay: 0.3s; }
        .vaga:nth-child(5) { animation-delay: 0.4s; }
        .vaga:nth-child(6) { animation-delay: 0.5s; }
        .vaga:nth-child(7) { animation-delay: 0.6s; }
        .vaga:nth-child(8) { animation-delay: 0.7s; }

        @keyframes vagaEntra {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .vaga::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            border-radius: 0 4px 4px 0;
            transition: all 0.3s ease;
        }

        .vaga:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateX(4px) scale(1.01);
        }

        .vaga .vaga-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .vaga h3 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: #e8edf5;
            letter-spacing: -0.2px;
        }

        .vaga .meta {
            color: #8892a8;
            font-size: 0.85rem;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .vaga .meta .platform-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 100px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5a657a;
        }

        .vaga .score {
            font-weight: 700;
            font-size: 1.1rem;
            padding: 4px 14px;
            border-radius: 100px;
            background: rgba(255, 217, 61, 0.08);
            color: #ffd93d;
            border: 1px solid rgba(255, 217, 61, 0.06);
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .vaga:hover .score {
            transform: scale(1.05);
        }

        .vaga .score.match-alta {
            background: rgba(78, 205, 196, 0.08);
            color: #4ecdc4;
            border-color: rgba(78, 205, 196, 0.06);
        }

        .vaga .score.match-media {
            background: rgba(255, 217, 61, 0.08);
            color: #ffd93d;
            border-color: rgba(255, 217, 61, 0.06);
        }

        .vaga .score.match-baixa {
            background: rgba(255, 107, 107, 0.08);
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.06);
        }

        .vaga .vaga-footer {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .vaga .vaga-footer .match-level {
            font-size: 0.8rem;
            color: #5a657a;
        }

        .vaga a {
            color: #818cf8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 100px;
            background: rgba(99, 102, 241, 0.06);
            border: 1px solid rgba(99, 102, 241, 0.06);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .vaga a:hover {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.15);
            transform: translateX(2px);
        }

        /* ============================================ */
        /* AVISOS */
        /* ============================================ */
        .aviso {
            background: rgba(255, 217, 61, 0.04);
            border: 1px solid rgba(255, 217, 61, 0.08);
            color: #f0c674;
            padding: 14px 18px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 0.9rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: fadeInUp 0.4s ease;
        }

        .aviso .aviso-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .aviso .aviso-text {
            line-height: 1.5;
        }

        /* ============================================ */
        /* EMPTY STATE */
        /* ============================================ */
        .empty-state {
            text-align: center;
            padding: 32px 20px;
            color: #5a657a;
            animation: fadeInUp 0.5s ease;
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.4;
            animation: flutuar 3s ease-in-out infinite;
        }

        @keyframes flutuar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .empty-state p {
            font-size: 0.95rem;
        }

        /* ============================================ */
        /* CONFETES */
        /* ============================================ */
        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100% + 50px)) rotate(720deg);
                opacity: 0;
            }
        }

        /* ============================================ */
        /* SCROLLBAR */
        /* ============================================ */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 100px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>

    <div class="container" id="app">

        <!-- ============================================ -->
        <!-- HEADER -->
        <!-- ============================================ -->
        <div class="header">
            <div class="header-icon">🎯</div>
            <h1>AutoMatch Career</h1>
        </div>
        <p class="subtitle">
            Envie seu currículo e receba as <span>5 melhores vagas</span> com fit calculado
        </p>

        <!-- ============================================ -->
        <!-- DROPZONE - CORRIGIDA -->
        <!-- ============================================ -->
        <label class="dropzone" id="dropzone">
            <input type="file" id="cvInput" accept="application/pdf">
            <span class="dropzone-icon">📄</span>
            <div class="dropzone-text">
                Clique ou arraste seu <strong>currículo</strong> aqui
            </div>
            <div class="dropzone-hint">Aceita apenas PDF</div>
            <div id="filename"></div>
        </label>

        <!-- ============================================ -->
        <!-- BOTÕES -->
        <!-- ============================================ -->
        <div class="btn-group">
            <button class="btn btn-primary" id="buscarBtn">
                🔍 Buscar vagas
            </button>
        </div>

        <!-- ============================================ -->
        <!-- STATUS -->
        <!-- ============================================ -->
        <div id="status"></div>

        <!-- ============================================ -->
        <!-- RESULTADOS -->
        <!-- ============================================ -->
        <div id="resultados"></div>

    </div>

    <script>
        // ============================================ */
        // DOM ELEMENTOS
        // ============================================ */
        const dropzone = document.getElementById('dropzone');
        const cvInput = document.getElementById('cvInput');
        const filenameEl = document.getElementById('filename');
        const buscarBtn = document.getElementById('buscarBtn');
        const statusEl = document.getElementById('status');
        const resultadosEl = document.getElementById('resultados');

        let pdfBase64 = null;

        // ============================================ */
        // DROPZONE EVENTS
        // ============================================ */
        dropzone.addEventListener('click', () => cvInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                cvInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });

        cvInput.addEventListener('change', () => {
            if (cvInput.files.length) handleFile(cvInput.files[0]);
        });

        // ============================================ */
        // HANDLE FILE
        // ============================================ */
        function handleFile(file) {
            if (file.type !== 'application/pdf') {
                filenameEl.textContent = '⚠️ Apenas PDF é suportado';
                filenameEl.style.color = '#ff6b6b';
                pdfBase64 = null;
                return;
            }

            filenameEl.textContent = `✅ ${file.name}`;
            filenameEl.style.color = '#818cf8';

            const reader = new FileReader();
            reader.onload = () => {
                pdfBase64 = reader.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        // ============================================ */
        // ESCAPE HTML
        // ============================================ */
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        // ============================================ */
        // GET SCORE CLASS
        // ============================================ */
        function getScoreClass(score) {
            if (score >= 80) return 'match-alta';
            if (score >= 50) return 'match-media';
            return 'match-baixa';
        }

        // ============================================ */
        // MOSTRA SKELETON LOADING
        // ============================================ */
        function showSkeleton() {
            let html = `
                <div class="skeleton-container">
                    <div class="skeleton-header">
                        <div class="skeleton-title"></div>
                        <div class="skeleton-count"></div>
                    </div>
            `;

            for (let i = 0; i < 3; i++) {
                html += `
                    <div class="skeleton-card">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                    </div>
                `;
            }

            html += `</div>`;
            resultadosEl.innerHTML = html;
        }

        // ============================================ */
        // CONFETES
        // ============================================ */
        function dispararConfetes() {
            const container = document.querySelector('.container');
            const confettiContainer = document.createElement('div');
            confettiContainer.className = 'confetti-container';
            container.appendChild(confettiContainer);

            const cores = ['#6366f1', '#8b5cf6', '#4ecdc4', '#ffd93d', '#ff6b6b', '#00d4ff'];
            const total = 40;

            for (let i = 0; i < total; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.width = (4 + Math.random() * 8) + 'px';
                confetti.style.height = (4 + Math.random() * 8) + 'px';
                confetti.style.background = cores[Math.floor(Math.random() * cores.length)];
                confetti.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                confetti.style.animationDelay = (Math.random() * 1.5) + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.opacity = 0.6 + Math.random() * 0.4;
                confettiContainer.appendChild(confetti);
            }

            setTimeout(() => {
                confettiContainer.remove();
            }, 4000);
        }

        // ============================================ */
        // BUSCAR VAGAS
        // ============================================ */
        async function buscar() {
            buscarBtn.disabled = true;

            showSkeleton();

            statusEl.innerHTML = `
                <div class="loading-waves">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <span class="status-text">
                    Analisando seu currículo e buscando vagas...
                </span>
            `;

            try {
                const body = { pdf_base64: pdfBase64 };
                const resp = await fetch('/api/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await resp.json();

                if (!resp.ok) {
                    statusEl.innerHTML = `❌ Erro: ${data.erro || 'Falha desconhecida'}`;
                    resultadosEl.innerHTML = '';
                    return;
                }

                const totalVagas = data.total_vagas_encontradas || 0;
                statusEl.innerHTML = `
                    <span style="color: #4ecdc4;">✅</span>
                    <span class="status-text">
                        <span class="highlight">${totalVagas}</span> vagas encontradas. Top 5 por fit:
                    </span>
                `;

                let html = '';

                if (data.fit_baixo) {
                    html += `
                        <div class="aviso">
                            <span class="aviso-icon">📊</span>
                            <span class="aviso-text">O fit geral das vagas encontradas hoje foi baixo — ainda assim, aqui estão as 5 melhores disponíveis.</span>
                        </div>
                    `;
                }

                if (data.top_vagas && data.top_vagas.length > 0) {
                    html += `
                        <div class="resultados-header">
                            <h2>🎯 Vagas recomendadas</h2>
                            <span class="count">${data.top_vagas.length} vagas</span>
                        </div>
                    `;

                    let hasHighScore = false;
                    data.top_vagas.forEach((vaga, index) => {
                        const score = vaga.match_score || 0;
                        const scoreClass = getScoreClass(score);
                        const delay = index * 0.08;
                        if (score >= 70) hasHighScore = true;

                        html += `
                            <div class="vaga" style="animation-delay: ${delay}s">
                                <div class="vaga-top">
                                    <div>
                                        <h3>${escapeHtml(vaga.title)}</h3>
                                        <div class="meta">
                                            <span>${escapeHtml(vaga.company || 'Empresa não informada')}</span>
                                            <span class="platform-badge">${escapeHtml(vaga.platform || '')}</span>
                                        </div>
                                    </div>
                                    <span class="score ${scoreClass}">${score}%</span>
                                </div>
                                <div class="vaga-footer">
                                    <span class="match-level">${escapeHtml(vaga.match_level || 'Fit calculado')}</span>
                                    <a href="${escapeHtml(vaga.url)}" target="_blank" rel="noopener">
                                        Ver vaga →
                                    </a>
                                </div>
                            </div>
                        `;
                    });

                    if (hasHighScore) {
                        setTimeout(dispararConfetes, 300);
                    }

                } else {
                    html += `
                        <div class="empty-state">
                            <div class="empty-icon">🔍</div>
                            <p>Nenhuma vaga encontrada para o seu perfil no momento.</p>
                        </div>
                    `;
                }

                resultadosEl.innerHTML = html;

            } catch (err) {
                statusEl.innerHTML = `❌ Erro de rede: ${escapeHtml(err.message)}`;
                resultadosEl.innerHTML = '';
            } finally {
                buscarBtn.disabled = false;
            }
        }

        // ============================================ */
        // EVENT LISTENERS
        // ============================================ */
        buscarBtn.addEventListener('click', () => {
            if (!pdfBase64) {
                statusEl.innerHTML = '⚠️ Selecione um PDF para criar seu perfil.';
                return;
            }
            buscar();
        });
    </script>

</body>
</html>
