<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMatch Career</title>
    <style>
        /* ============================================ */
        /* RESET E BASE - PREMIUM */
        /* ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0b0d11;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(139, 92, 246, 0.06) 0%, transparent 60%);
        }

        .container {
            max-width: 680px;
            width: 100%;
            background: rgba(20, 23, 31, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
                border-radius: 24px;
            }
        }

        /* ============================================ */
        /* HEADER */
        /* ============================================ */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 6px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e8edf5 0%, #a5b4d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #8892a8;
            font-size: 0.95rem;
            margin-top: 2px;
            margin-bottom: 32px;
            padding-left: 4px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .subtitle span {
            color: #818cf8;
            font-weight: 500;
        }

        /* ============================================ */
        /* DROPZONE - PREMIUM */
        /* ============================================ */
        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 44px 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: rgba(255, 255, 255, 0.02);
            position: relative;
            overflow: hidden;
        }

        .dropzone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.03), rgba(139, 92, 246, 0.03));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .dropzone:hover::before,
        .dropzone.dragover::before {
            opacity: 1;
        }

        .dropzone:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.06);
        }

        .dropzone.dragover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.04);
            transform: translateY(-2px);
            box-shadow: 0 12px 48px rgba(99, 102, 241, 0.10);
        }

        .dropzone input {
            display: none;
        }

        .dropzone-icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: block;
            opacity: 0.6;
        }

        .dropzone-text {
            color: #b0bcca;
            font-size: 1rem;
            font-weight: 450;
            letter-spacing: 0.2px;
        }

        .dropzone-text strong {
            color: #818cf8;
            font-weight: 600;
        }

        .dropzone-hint {
            color: #5a657a;
            font-size: 0.8rem;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        #filename {
            margin-top: 14px;
            color: #818cf8;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.08);
            border-radius: 100px;
            display: inline-block;
            border: 1px solid rgba(99, 102, 241, 0.10);
            transition: all 0.3s ease;
        }

        #filename:empty {
            display: none;
        }

        /* ============================================ */
        /* BOTÕES - PREMIUM */
        /* ============================================ */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        @media (max-width: 480px) {
            .btn-group {
                flex-direction: column;
            }
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0px);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: #b0bcca;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .btn-secondary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ============================================ */
        /* STATUS */
        /* ============================================ */
        #status {
            margin-top: 20px;
            color: #8892a8;
            font-size: 0.9rem;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            min-height: 20px;
            transition: all 0.3s ease;
        }

        #status:empty {
            display: none;
        }

        /* ============================================ */
        /* RESULTADOS */
        /* ============================================ */
        #resultados {
            margin-top: 28px;
        }

        .resultados-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .resultados-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #b0bcca;
            letter-spacing: 0.5px;
        }

        .resultados-header .count {
            font-size: 0.8rem;
            color: #5a657a;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px;
            border-radius: 100px;
        }

        .vaga {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 20px 22px;
            margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .vaga::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            border-radius: 0 4px 4px 0;
            transition: all 0.3s ease;
        }

        .vaga:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateX(4px);
        }

        .vaga .vaga-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .vaga h3 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: #e8edf5;
            letter-spacing: -0.2px;
        }

        .vaga .meta {
            color: #8892a8;
            font-size: 0.85rem;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .vaga .meta .platform-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 100px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5a657a;
        }

        .vaga .score {
            font-weight: 700;
            font-size: 1.1rem;
            padding: 4px 14px;
            border-radius: 100px;
            background: rgba(255, 217, 61, 0.08);
            color: #ffd93d;
            border: 1px solid rgba(255, 217, 61, 0.06);
            white-space: nowrap;
        }

        .vaga .score.match-alta {
            background: rgba(78, 205, 196, 0.08);
            color: #4ecdc4;
            border-color: rgba(78, 205, 196, 0.06);
        }

        .vaga .score.match-media {
            background: rgba(255, 217, 61, 0.08);
            color: #ffd93d;
            border-color: rgba(255, 217, 61, 0.06);
        }

        .vaga .score.match-baixa {
            background: rgba(255, 107, 107, 0.08);
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.06);
        }

        .vaga .vaga-footer {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .vaga .vaga-footer .match-level {
            font-size: 0.8rem;
            color: #5a657a;
        }

        .vaga a {
            color: #818cf8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 100px;
            background: rgba(99, 102, 241, 0.06);
            border: 1px solid rgba(99, 102, 241, 0.06);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .vaga a:hover {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.15);
            transform: translateX(2px);
        }

        /* ============================================ */
        /* AVISOS */
        /* ============================================ */
        .aviso {
            background: rgba(255, 217, 61, 0.04);
            border: 1px solid rgba(255, 217, 61, 0.08);
            color: #f0c674;
            padding: 14px 18px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 0.9rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .aviso .aviso-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .aviso .aviso-text {
            line-height: 1.5;
        }

        /* ============================================ */
        /* LOADING */
        /* ============================================ */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-top: 2px solid #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================ */
        /* EMPTY STATE */
        /* ============================================ */
        .empty-state {
            text-align: center;
            padding: 32px 20px;
            color: #5a657a;
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 0.95rem;
        }

        /* ============================================ */
        /* SCROLLBAR */
        /* ============================================ */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 100px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ============================================ -->
        <!-- HEADER -->
        <!-- ============================================ -->
        <div class="header">
            <div class="header-icon">🎯</div>
            <h1>AutoMatch Career</h1>
        </div>
        <p class="subtitle">
            Envie seu currículo e receba as <span>5 melhores vagas</span> com fit calculado
        </p>

        <!-- ============================================ -->
        <!-- DROPZONE -->
        <!-- ============================================ -->
        <label class="dropzone" id="dropzone">
            <input type="file" id="cvInput" accept="application/pdf">
            <span class="dropzone-icon">📄</span>
            <div class="dropzone-text">
                Clique ou arraste seu <strong>currículo</strong> aqui
            </div>
            <div class="dropzone-hint">Aceita apenas PDF</div>
            <div id="filename"></div>
        </label>

        <!-- ============================================ -->
        <!-- BOTÕES -->
        <!-- ============================================ -->
        <div class="btn-group">
            <button class="btn btn-primary" id="buscarBtn">
                🔍 Buscar vagas
            </button>
            <button class="btn btn-secondary" id="semCvBtn">
                Perfil padrão
            </button>
        </div>

        <!-- ============================================ -->
        <!-- STATUS -->
        <!-- ============================================ -->
        <div id="status"></div>

        <!-- ============================================ -->
        <!-- RESULTADOS -->
        <!-- ============================================ -->
        <div id="resultados"></div>

    </div>

    <script>
        // ============================================ */
        // DOM ELEMENTOS
        // ============================================ */
        const dropzone = document.getElementById('dropzone');
        const cvInput = document.getElementById('cvInput');
        const filenameEl = document.getElementById('filename');
        const buscarBtn = document.getElementById('buscarBtn');
        const semCvBtn = document.getElementById('semCvBtn');
        const statusEl = document.getElementById('status');
        const resultadosEl = document.getElementById('resultados');

        let pdfBase64 = null;

        // ============================================ */
        // DROPZONE EVENTS
        // ============================================ */
        dropzone.addEventListener('click', () => cvInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                cvInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });

        cvInput.addEventListener('change', () => {
            if (cvInput.files.length) handleFile(cvInput.files[0]);
        });

        // ============================================ */
        // HANDLE FILE
        // ============================================ */
        function handleFile(file) {
            if (file.type !== 'application/pdf') {
                filenameEl.textContent = '⚠️ Apenas PDF é suportado';
                filenameEl.style.color = '#ff6b6b';
                pdfBase64 = null;
                return;
            }

            filenameEl.textContent = `✅ ${file.name}`;
            filenameEl.style.color = '#818cf8';

            const reader = new FileReader();
            reader.onload = () => {
                pdfBase64 = reader.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        // ============================================ */
        // ESCAPE HTML
        // ============================================ */
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        // ============================================ */
        // GET SCORE CLASS
        // ============================================ */
        function getScoreClass(score) {
            if (score >= 80) return 'match-alta';
            if (score >= 50) return 'match-media';
            return 'match-baixa';
        }

        // ============================================ */
        // BUSCAR VAGAS
        // ============================================ */
        async function buscar(comCv) {
            // Desabilita botões
            buscarBtn.disabled = true;
            semCvBtn.disabled = true;
            resultadosEl.innerHTML = '';

            // Mostra loading no status
            statusEl.innerHTML = `
                <span class="loading"></span>
                ${comCv ? 'Analisando seu currículo e buscando vagas...' : 'Buscando vagas com perfil padrão...'}
            `;

            try {
                const body = comCv && pdfBase64 ? { pdf_base64: pdfBase64 } : {};
                const resp = await fetch('/api/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await resp.json();

                if (!resp.ok) {
                    statusEl.innerHTML = `❌ Erro: ${data.erro || 'Falha desconhecida'}`;
                    return;
                }

                // Atualiza status
                const statusMsg = `${data.total_vagas_encontradas || 0} vagas encontradas. Top 5 por fit:`;
                statusEl.innerHTML = `✅ ${statusMsg}`;

                // Monta resultados
                let html = '';

                // Avisos
                if (data.aviso_cv) {
                    html += `
                        <div class="aviso">
                            <span class="aviso-icon">⚠️</span>
                            <span class="aviso-text">Não deu pra usar o currículo (${escapeHtml(data.aviso_cv)}). Mostrando resultado com o perfil padrão.</span>
                        </div>
                    `;
                }

                if (data.fit_baixo) {
                    html += `
                        <div class="aviso">
                            <span class="aviso-icon">📊</span>
                            <span class="aviso-text">O fit geral das vagas encontradas hoje foi baixo — ainda assim, aqui estão as 5 melhores disponíveis.</span>
                        </div>
                    `;
                }

                // Vagas
                if (data.top_vagas && data.top_vagas.length > 0) {
                    html += `
                        <div class="resultados-header">
                            <h2>🎯 Vagas recomendadas</h2>
                            <span class="count">${data.top_vagas.length} vagas</span>
                        </div>
                    `;

                    data.top_vagas.forEach(vaga => {
                        const score = vaga.match_score || 0;
                        const scoreClass = getScoreClass(score);

                        html += `
                            <div class="vaga">
                                <div class="vaga-top">
                                    <div>
                                        <h3>${escapeHtml(vaga.title)}</h3>
                                        <div class="meta">
                                            <span>${escapeHtml(vaga.company || 'Empresa não informada')}</span>
                                            <span class="platform-badge">${escapeHtml(vaga.platform || '')}</span>
                                        </div>
                                    </div>
                                    <span class="score ${scoreClass}">${score}%</span>
                                </div>
                                <div class="vaga-footer">
                                    <span class="match-level">${escapeHtml(vaga.match_level || 'Fit calculado')}</span>
                                    <a href="${escapeHtml(vaga.url)}" target="_blank" rel="noopener">
                                        Ver vaga →
                                    </a>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html += `
                        <div class="empty-state">
                            <div class="empty-icon">🔍</div>
                            <p>Nenhuma vaga encontrada para o seu perfil no momento.</p>
                        </div>
                    `;
                }

                resultadosEl.innerHTML = html;

            } catch (err) {
                statusEl.innerHTML = `❌ Erro de rede: ${escapeHtml(err.message)}`;
            } finally {
                buscarBtn.disabled = false;
                semCvBtn.disabled = false;
            }
        }

        // ============================================ */
        // EVENT LISTENERS
        // ============================================ */
        buscarBtn.addEventListener('click', () => {
            if (!pdfBase64) {
                statusEl.innerHTML = '⚠️ Selecione um PDF primeiro, ou use "Perfil padrão".';
                return;
            }
            buscar(true);
        });

        semCvBtn.addEventListener('click', () => buscar(false));
    </script>

</body>
</html>
